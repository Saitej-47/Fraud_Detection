name: Fraud Detection CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost fastapi uvicorn pydantic kafka-python mlflow evidently

      - name: Check Python files
        run: |
          python -m py_compile src/*.py
          python -m py_compile api/main.py

      - name: Verify project structure
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f requirements.txt
          test -f api/main.py
          test -f src/train_xgboost.py
          test -f src/monitoring.py

      - name: CI completed
        run: echo "Fraud Detection CI passed successfully!"